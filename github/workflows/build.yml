name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git
          cd pico-sdk && git submodule update --init --depth 1

      - name: TinyUSB
        run: |
          git clone --depth 1 --branch 0.18.0 https://github.com/hathach/tinyusb.git

      - name: Buduj
        run: |
          mkdir -p build && cd build
          cmake .. -DPICO_SDK_PATH=../pico-sdk
          make -j4

      - name: Plik uf2
        uses: actions/upload-artifact@v4
        with:
          name: manipulator-uf2
          path: build/*.uf2
